<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1457"/>
    </linearGradient>
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#607d8b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#3a1870" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- LiDAR sensor (vehicle) -->
  <rect x="130" y="200" width="60" height="30" rx="4" fill="#00bcd4" opacity="0.8"/>
  <circle cx="160" cy="210" r="8" fill="#ffffff" opacity="0.9"/>
  <text x="160" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#80deea">LiDAR</text>
  <!-- Original laser beam (to real target) -->
  <line x1="190" y1="215" x2="530" y2="215" stroke="#00e676" stroke-width="1.5" opacity="0.5" stroke-dasharray="8,4"/>
  <!-- Actuated mirror -->
  <rect x="520" y="180" width="14" height="80" rx="2" fill="url(#mirrorGrad)" transform="rotate(-20 527 220)"/>
  <text x="545" y="175" font-family="monospace" font-size="10" fill="#cfd8dc">mirror</text>
  <!-- Reflected beam (attack path) -->
  <polyline points="190,215 527,220 630,340" fill="none" stroke="#ff1744" stroke-width="2" opacity="0.85"/>
  <!-- Ghost reflection point -->
  <circle cx="630" cy="340" r="7" fill="#ff1744" opacity="0.9"/>
  <circle cx="650" cy="355" r="5" fill="#ff5252" opacity="0.7"/>
  <circle cx="615" cy="350" r="4" fill="#ff5252" opacity="0.7"/>
  <text x="655" y="345" font-family="monospace" font-size="10" fill="#ff6e6e">ghost reflection</text>
  <!-- Real scene points -->
  <g fill="#69f0ae" opacity="0.7">
    <circle cx="560" cy="140" r="4"/>
    <circle cx="590" cy="150" r="4"/>
    <circle cx="575" cy="130" r="4"/>
    <circle cx="610" cy="145" r="4"/>
  </g>
  <!-- Labels -->
  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">MirrorDrift</text>
  <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="12" fill="#ce93d8">Actuated Mirror Attack on LiDAR SLAM · IROS 2026</text>
  <text x="340" y="208" text-anchor="middle" font-family="monospace" font-size="9" fill="#69f0ae" opacity="0.7">original beam</text>
  <text x="590" y="295" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff6e6e">reflected (attack)</text>
</svg>
