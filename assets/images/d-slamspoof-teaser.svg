<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b3a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#1e4d7a" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- LiDAR scan lines (green, legit) -->
  <g stroke="#00e676" stroke-width="1.2" opacity="0.7">
    <line x1="400" y1="225" x2="150" y2="80"/>
    <line x1="400" y1="225" x2="200" y2="60"/>
    <line x1="400" y1="225" x2="260" y2="55"/>
    <line x1="400" y1="225" x2="320" y2="50"/>
    <line x1="400" y1="225" x2="540" y2="55"/>
    <line x1="400" y1="225" x2="600" y2="60"/>
    <line x1="400" y1="225" x2="650" y2="80"/>
  </g>
  <!-- Injected fake points (red, attack) -->
  <g fill="#ff1744" opacity="0.9">
    <circle cx="500" cy="320" r="5"/>
    <circle cx="540" cy="330" r="5"/>
    <circle cx="480" cy="340" r="5"/>
    <circle cx="560" cy="315" r="5"/>
    <circle cx="520" cy="350" r="5"/>
    <circle cx="580" cy="335" r="5"/>
  </g>
  <!-- Attack injection lines -->
  <g stroke="#ff1744" stroke-width="1" stroke-dasharray="6,3" opacity="0.6">
    <line x1="400" y1="225" x2="500" y2="320"/>
    <line x1="400" y1="225" x2="540" y2="330"/>
    <line x1="400" y1="225" x2="480" y2="340"/>
  </g>
  <!-- LiDAR sensor dot -->
  <circle cx="400" cy="225" r="10" fill="#00bcd4" opacity="0.9"/>
  <circle cx="400" cy="225" r="5" fill="#ffffff"/>
  <!-- Labels -->
  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">D-SLAMSpoof</text>
  <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="12" fill="#90caf9">Dynamic Point Cloud Injection · IROS 2026</text>
  <rect x="430" y="295" width="120" height="22" rx="4" fill="#ff1744" opacity="0.15"/>
  <text x="490" y="311" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff6e6e">injected points</text>
  <text x="195" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#69f0ae">legit scan</text>
</svg>
